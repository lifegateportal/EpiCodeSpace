name: EpiCodeSpace Agent Config
version: 1.0.0
schema: v1

models:
  - name: GPT-5 Chat
    provider: openai
    model: gpt-5
    apiKey: ${{ secrets.OPENAI_API_KEY }}
    roles:
      - chat
      - apply
      - edit
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 32000
      temperature: 0.1
    capabilities:
      - tool_use

  - name: GPT-5 Fast
    provider: openai
    model: gpt-5-mini
    apiKey: ${{ secrets.OPENAI_API_KEY }}
    roles:
      - autocomplete
      - edit
    defaultCompletionOptions:
      contextLength: 128000
      maxTokens: 16000
      temperature: 0.1
    capabilities:
      - tool_use

  - name: Claude Sonnet 4.5
    provider: anthropic
    model: claude-sonnet-4-5
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - apply
      - edit
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 32000
      temperature: 0.1
    capabilities:
      - tool_use
