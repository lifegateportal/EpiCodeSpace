kind = "web"
previewPath = "/"
title = "EpiCodeSpace"
version = "1.0.0"
id = "artifacts/epicodespace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21256

[services.development]
run = "pnpm --filter @workspace/epicodespace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/epicodespace", "run", "build" ]

[services.production.run]
args = ["node", "artifacts/epicodespace/serve.mjs"]

[services.production.run.env]
PORT = "21256"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "21256"
BASE_PATH = "/"
